# Example GitHub Actions workflow for the HOST app (the Astro project that uses emdash-multisite).
# Copy to the host repo as .github/workflows/deploy.yml.
#
# Secrets to create in the host repo:
#   CLOUDFLARE_API_TOKEN    Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit on the account
#   CLOUDFLARE_ACCOUNT_ID
#   MULTISITE_READ_TOKEN    fine-grained token with read-only "Contents" access to theweekendprojects/emdash-multisite
# Worker secrets (BETTER_AUTH_SECRET, MULTISITE_SECRET) are set once with `wrangler secret put`, not here.
name: deploy
on:
  push:
    branches: [main]
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # emdash-multisite is private and pinned by tag in package.json:
      #   "emdash-multisite": "github:theweekendprojects/emdash-multisite#v0.2.1"
      - run: git config --global url."https://x-access-token:${{ secrets.MULTISITE_READ_TOKEN }}@github.com/".insteadOf "https://github.com/"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec astro build
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Cron changes are not applied by a version deploy; wrangler deploy applies them.
